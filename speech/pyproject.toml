[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "family-ai-speech"
version = "0.1.0"
description = "Local OpenAI-compatible STT and TTS service for Family AI"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "faster-whisper>=1.2,<2.0",
    "pydantic-settings>=2.6,<3.0",
    "python-multipart>=0.0.9",
    "silero>=0.5.5,<0.6",
    "torch>=2.13,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<9.0",
    "ruff>=0.8,<1.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.hatch.build.targets.wheel]
packages = ["family_ai_speech"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
