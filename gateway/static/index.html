<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f4ec" />
  <title>Клуб любопытных</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='50' font-size='48'%3E%E2%9C%A6%3C/text%3E%3C/svg%3E" />
  <style>
    :root {
      color-scheme: light;
      --ink: #243047;
      --muted: #68758a;
      --paper: #fffdf8;
      --canvas: #f4f0e7;
      --line: rgba(42, 54, 76, 0.12);
      --theme: #356fc0;
      --theme-soft: #e7f0fd;
      --theme-deep: #214d8a;
      --safe-bottom: max(14px, env(safe-area-inset-bottom));
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    html, body { min-height: 100%; }
    body {
      margin: 0;
      color: var(--ink);
      font-family: "Segoe UI", "Trebuchet MS", system-ui, sans-serif;
      background:
        radial-gradient(circle at 8% 10%, rgba(235, 183, 88, 0.16), transparent 28%),
        radial-gradient(circle at 92% 88%, rgba(70, 129, 190, 0.14), transparent 30%),
        var(--canvas);
      overflow-x: hidden;
    }

    button, input { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }

    .app-shell {
      width: min(1240px, calc(100% - 32px));
      min-height: calc(100dvh - 32px);
      margin: 16px auto;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.85);
      border-radius: 32px;
      background: rgba(255, 253, 248, 0.94);
      box-shadow: 0 24px 70px rgba(42, 54, 76, 0.12);
    }

    .brand-mark {
      display: inline-grid;
      grid-template-columns: repeat(3, 10px);
      gap: 5px;
      align-items: end;
      width: 42px;
      height: 42px;
      padding: 9px;
      border-radius: 14px;
      color: #fff;
      background: var(--ink);
    }
    .brand-mark span { width: 8px; border-radius: 9px; background: #fff; }
    .brand-mark span:nth-child(1) { height: 10px; }
    .brand-mark span:nth-child(2) { height: 22px; background: #f3bd5b; }
    .brand-mark span:nth-child(3) { height: 16px; }

    .chooser {
      min-height: calc(100dvh - 34px);
      padding: clamp(22px, 4vw, 52px);
      display: flex;
      flex-direction: column;
    }

    .chooser-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-copy strong { display: block; font-size: 1rem; letter-spacing: 0.01em; }
    .brand-copy span { color: var(--muted); font-size: 0.82rem; }
    .chooser-actions { display: flex; align-items: center; gap: 12px; }
    .parent-note { color: var(--muted); font-size: 0.78rem; }
    .speech-toggle {
      display: inline-grid;
      place-items: center;
      width: 46px;
      height: 46px;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 15px;
      color: var(--ink);
      background: #fff;
      cursor: pointer;
      font-size: 1.15rem;
      box-shadow: 0 7px 16px rgba(42, 54, 76, 0.05);
    }
    .speech-toggle.is-off { color: var(--muted); background: #f1efe9; }

    .chooser-title {
      margin: clamp(34px, 7vh, 76px) 0 clamp(24px, 4vh, 42px);
      text-align: center;
    }
    .chooser-title .visual-question {
      display: inline-grid;
      place-items: center;
      width: 72px;
      height: 72px;
      margin-bottom: 16px;
      border: 2px solid var(--line);
      border-radius: 50%;
      font-size: 2rem;
      background: #fff;
      box-shadow: 0 12px 28px rgba(42, 54, 76, 0.08);
    }
    .chooser-title h1 { margin: 0; font-size: clamp(2rem, 4vw, 3.25rem); letter-spacing: -0.045em; }
    .chooser-title p { margin: 9px 0 0; color: var(--muted); font-size: clamp(0.95rem, 2vw, 1.15rem); }

    .agent-grid {
      width: min(1080px, 100%);
      margin: auto;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: clamp(12px, 2vw, 22px);
    }

    .agent-card {
      position: relative;
      width: 100%;
      min-width: 0;
      min-height: 390px;
      padding: 0;
      overflow: hidden;
      border: 2px solid transparent;
      border-radius: 28px;
      color: var(--ink);
      background: var(--agent-soft, #edf3fb);
      cursor: pointer;
      isolation: isolate;
      transition: transform 180ms ease, box-shadow 180ms ease, border-color 180ms ease;
    }
    .agent-card::before {
      content: "";
      position: absolute;
      inset: 18px 18px auto auto;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--agent-color, #356fc0);
      opacity: 0.12;
    }
    .agent-card:hover, .agent-card:focus-visible {
      transform: translateY(-7px);
      border-color: color-mix(in srgb, var(--agent-color, #356fc0) 58%, white);
      box-shadow: 0 20px 38px rgba(42, 54, 76, 0.14);
      outline: none;
    }
    .agent-card:active { transform: translateY(-2px) scale(0.99); }
    .agent-card-art {
      position: absolute;
      inset: 12px 0 92px;
      width: 100%;
      height: calc(100% - 88px);
      object-fit: contain;
      object-position: center bottom;
      filter: drop-shadow(0 14px 12px rgba(42, 54, 76, 0.1));
      transition: transform 220ms ease;
    }
    .agent-card:hover .agent-card-art { transform: scale(1.035); }
    .agent-card-copy {
      position: absolute;
      inset: auto 0 0;
      min-height: 100px;
      padding: 17px 16px 18px;
      text-align: center;
      background: linear-gradient(to bottom, transparent, var(--agent-soft, #edf3fb) 24%);
    }
    .agent-card-name { display: block; font-size: 1.14rem; font-weight: 800; }
    .agent-card-hint { display: block; margin-top: 4px; color: var(--muted); font-size: 0.78rem; line-height: 1.35; }
    .agent-card-sound {
      position: absolute;
      top: 17px;
      left: 17px;
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      color: var(--agent-color, #356fc0);
      background: rgba(255, 255, 255, 0.78);
      box-shadow: 0 8px 18px rgba(42, 54, 76, 0.08);
      font-size: 1.25rem;
    }

    .conversation {
      min-height: calc(100dvh - 34px);
      display: grid;
      grid-template-columns: minmax(290px, 370px) minmax(0, 1fr);
      background: var(--paper);
    }

    .companion-panel {
      position: relative;
      min-height: 100%;
      padding: 24px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: var(--theme-soft);
      border-right: 1px solid var(--line);
    }
    .companion-panel::before, .companion-panel::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      background: var(--theme);
      opacity: 0.08;
    }
    .companion-panel::before { width: 260px; height: 260px; top: -110px; right: -100px; }
    .companion-panel::after { width: 190px; height: 190px; bottom: -80px; left: -70px; }

    .companion-top { position: relative; z-index: 2; display: flex; justify-content: space-between; align-items: center; }
    .companion-actions { display: flex; gap: 9px; }
    .icon-button {
      display: inline-grid;
      place-items: center;
      width: 48px;
      height: 48px;
      padding: 0;
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 16px;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.72);
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(42, 54, 76, 0.06);
    }
    .switch-symbol { display: grid; grid-template-columns: repeat(2, 7px); gap: 4px; }
    .switch-symbol span { width: 7px; height: 7px; border-radius: 3px; background: currentColor; }
    .new-conversation-symbol { font-size: 1.45rem; font-weight: 800; line-height: 1; }
    .new-conversation.confirming {
      color: #fff;
      border-color: #d87831;
      background: #d87831;
      transform: scale(1.04);
    }

    .visual-status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 38px;
      padding: 8px 12px;
      border-radius: 99px;
      color: var(--theme-deep);
      background: rgba(255, 255, 255, 0.7);
      font-size: 0.78rem;
      font-weight: 750;
    }
    .status-dot { width: 9px; height: 9px; border-radius: 50%; background: #42a579; box-shadow: 0 0 0 5px rgba(66, 165, 121, 0.13); }
    .visual-status.listening .status-dot { background: #df6d52; animation: status-pulse 1s infinite; }
    .visual-status.busy .status-dot { background: #e6a43a; animation: status-pulse 1s infinite; }
    .visual-status.speaking .status-dot { background: var(--theme); animation: status-pulse 0.7s infinite; }
    .visual-status.error .status-dot { background: #c64d4d; }
    @keyframes status-pulse { 50% { transform: scale(1.45); opacity: 0.55; } }

    .companion-stage {
      position: relative;
      z-index: 1;
      flex: 1;
      min-height: 360px;
      display: grid;
      place-items: center;
    }
    .companion-halo {
      position: absolute;
      width: min(82%, 300px);
      aspect-ratio: 1;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.52);
      border: 1px solid rgba(255, 255, 255, 0.84);
    }
    .companion-art {
      position: relative;
      z-index: 1;
      width: min(100%, 330px);
      height: min(54vh, 500px);
      object-fit: contain;
      object-position: center bottom;
      filter: drop-shadow(0 20px 18px rgba(42, 54, 76, 0.12));
      transform-origin: center bottom;
    }
    .conversation[data-state="ready"] .companion-art { animation: idle 4.4s ease-in-out infinite; }
    .conversation[data-state="listening"] .companion-art { animation: breathe 1.2s ease-in-out infinite; }
    .conversation[data-state="busy"] .companion-art { animation: think 1.6s ease-in-out infinite; }
    .conversation[data-state="speaking"] .companion-art { animation: talk 0.75s ease-in-out infinite; }
    .conversation[data-state="responded"] .companion-art { animation: celebrate 0.9s cubic-bezier(0.2, 0.8, 0.3, 1); }
    @keyframes idle {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-3px) scale(1.006); }
    }
    @keyframes breathe { 50% { transform: scale(1.025); } }
    @keyframes think { 50% { transform: translateY(-5px) rotate(-1deg); } }
    @keyframes talk { 50% { transform: translateY(-3px) scale(1.01); } }
    @keyframes celebrate {
      0% { transform: translateY(0) scale(1); }
      35% { transform: translateY(-12px) scale(1.025) rotate(-1.5deg); }
      62% { transform: translateY(0) scale(0.995) rotate(1deg); }
      82% { transform: translateY(-4px) scale(1.008); }
      100% { transform: translateY(0) scale(1); }
    }

    .companion-copy { position: relative; z-index: 2; text-align: center; }
    .companion-copy h1 { margin: 0; font-size: 1.7rem; letter-spacing: -0.03em; }
    .companion-copy p { margin: 7px auto 0; max-width: 290px; color: var(--muted); font-size: 0.88rem; line-height: 1.45; }

    .dialog-panel {
      min-width: 0;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      background: var(--paper);
    }
    .mobile-header { display: none; }

    .prompt-strip {
      display: flex;
      gap: 10px;
      padding: 22px 24px 14px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .prompt-strip::-webkit-scrollbar { display: none; }
    .prompt-button {
      flex: 0 0 auto;
      min-width: 68px;
      min-height: 62px;
      padding: 8px 13px;
      border: 1px solid var(--line);
      border-radius: 18px;
      color: var(--ink);
      background: #fff;
      cursor: pointer;
      box-shadow: 0 7px 16px rgba(42, 54, 76, 0.05);
    }
    .prompt-icon { display: block; font-size: 1.5rem; }
    .prompt-label { display: block; margin-top: 3px; color: var(--muted); font-size: 0.68rem; }

    .chat-container {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 12px clamp(18px, 4vw, 48px) 22px;
      scrollbar-color: #d7dce4 transparent;
    }
    .welcome-card {
      width: min(520px, 92%);
      margin: auto;
      padding: 28px;
      border: 1px dashed color-mix(in srgb, var(--theme) 34%, white);
      border-radius: 28px;
      text-align: center;
      background: color-mix(in srgb, var(--theme-soft) 48%, white);
    }
    .welcome-symbol { display: block; margin-bottom: 10px; font-size: 2rem; }
    .welcome-card p { margin: 0; color: var(--muted); line-height: 1.5; }

    .message-row { display: flex; gap: 9px; align-items: flex-end; max-width: min(82%, 680px); animation: message-in 180ms ease-out; }
    .message-row.assistant { align-self: flex-start; }
    .message-row.child { align-self: flex-end; flex-direction: row-reverse; }
    @keyframes message-in { from { opacity: 0; transform: translateY(7px); } }
    .avatar { width: 36px; height: 36px; flex: 0 0 auto; overflow: hidden; display: grid; place-items: center; border-radius: 50%; background: var(--theme-soft); }
    .avatar img { width: 130%; height: 130%; object-fit: contain; object-position: center 20%; }
    .child .avatar { font-size: 1.05rem; }
    .message { padding: 12px 15px; border-radius: 20px; line-height: 1.5; overflow-wrap: anywhere; box-shadow: 0 7px 18px rgba(42, 54, 76, 0.06); }
    .assistant .message { border-bottom-left-radius: 6px; background: var(--theme-soft); }
    .child .message { border-bottom-right-radius: 6px; background: #f0eee8; }
    .message-media { width: min(440px, 72vw); margin: 12px 0 0; overflow: hidden; border-radius: 16px; background: rgba(255, 255, 255, 0.72); }
    .message-media img { display: block; width: 100%; max-height: 390px; object-fit: cover; background: #e8edf2; }
    .message-media figcaption { padding: 7px 10px 9px; font-size: 0.7rem; line-height: 1.25; }
    .message-media a { color: var(--theme-deep); text-decoration: none; opacity: 0.75; }
    .message-media a:focus-visible { outline: 2px solid var(--theme); outline-offset: 2px; }
    .system-message { align-self: center; max-width: 85%; padding: 10px 14px; border-radius: 14px; color: #8d4438; background: #fff0ec; text-align: center; font-size: 0.86rem; }

    .typing-indicator {
      align-self: flex-start;
      display: none;
      align-items: center;
      gap: 5px;
      margin-left: 44px;
      padding: 12px 15px;
      border-radius: 18px 18px 18px 6px;
      background: var(--theme-soft);
    }
    .typing-indicator.visible { display: flex; }
    .typing-indicator span { width: 7px; height: 7px; border-radius: 50%; background: var(--theme); animation: dots 1.1s infinite; }
    .typing-indicator span:nth-child(2) { animation-delay: 0.16s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.32s; }
    @keyframes dots { 50% { transform: translateY(-4px); opacity: 0.5; } }

    .control-dock {
      position: relative;
      padding: 16px 24px var(--safe-bottom);
      border-top: 1px solid var(--line);
      background: rgba(255, 253, 248, 0.94);
      backdrop-filter: blur(14px);
    }
    .voice-controls { display: grid; grid-template-columns: 52px 1fr 52px; align-items: center; gap: 16px; max-width: 520px; margin: 0 auto; }
    .voice-controls.has-photo { grid-template-columns: 52px 52px 1fr 52px; }
    .dock-button {
      width: 52px;
      height: 52px;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 18px;
      color: var(--ink);
      background: #fff;
      cursor: pointer;
      font-size: 1.2rem;
    }
    .dock-button.is-off { color: var(--muted); background: #f1efe9; }
    .mic-button {
      position: relative;
      justify-self: center;
      width: 92px;
      height: 92px;
      border: 0;
      border-radius: 50%;
      color: #fff;
      background: var(--theme);
      cursor: pointer;
      box-shadow: 0 12px 28px color-mix(in srgb, var(--theme) 34%, transparent);
      transition: transform 150ms ease;
    }
    .mic-button::before { content: ""; position: absolute; inset: -7px; border: 2px solid color-mix(in srgb, var(--theme) 28%, transparent); border-radius: 50%; }
    .mic-button:hover { transform: translateY(-3px); }
    .mic-button:active { transform: scale(0.97); }
    .mic-button.recording::before { animation: record-ring 1.15s infinite; }
    @keyframes record-ring { 70%, 100% { inset: -24px; opacity: 0; } }
    .mic-symbol { position: relative; display: inline-block; width: 20px; height: 30px; border: 3px solid currentColor; border-radius: 12px; }
    .mic-symbol::before { content: ""; position: absolute; left: 50%; bottom: -11px; width: 30px; height: 20px; border: 3px solid currentColor; border-top: 0; border-radius: 0 0 18px 18px; transform: translateX(-50%); }
    .mic-symbol::after { content: ""; position: absolute; left: 50%; bottom: -17px; width: 3px; height: 8px; background: currentColor; transform: translateX(-50%); }
    .mic-button.recording .mic-symbol { width: 25px; height: 25px; border: 0; border-radius: 8px; background: currentColor; }
    .mic-button.recording .mic-symbol::before, .mic-button.recording .mic-symbol::after { display: none; }

    .text-composer { max-width: 700px; margin: 14px auto 0; display: flex; gap: 9px; }
    .text-composer input { flex: 1; min-width: 0; height: 52px; padding: 0 16px; border: 1px solid var(--line); border-radius: 17px; outline: none; color: var(--ink); background: #fff; }
    .text-composer input:focus { border-color: var(--theme); box-shadow: 0 0 0 4px color-mix(in srgb, var(--theme) 12%, transparent); }
    .send-button { width: 52px; height: 52px; padding: 0; border: 0; border-radius: 17px; color: #fff; background: var(--theme); cursor: pointer; font-size: 1.25rem; }

    button:disabled { opacity: 0.45; cursor: not-allowed; }

    @media (max-width: 980px) {
      .agent-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); max-width: 700px; }
      .agent-card { min-height: 330px; }
      .conversation { grid-template-columns: 300px minmax(0, 1fr); }
      .companion-panel { padding: 18px; }
    }

    @media (max-width: 720px) {
      body { background: var(--paper); }
      .app-shell { width: 100%; min-height: 100dvh; margin: 0; border: 0; border-radius: 0; box-shadow: none; }
      .chooser { min-height: 100dvh; padding: 18px 14px calc(20px + env(safe-area-inset-bottom)); }
      .brand-copy span, .parent-note { display: none; }
      .chooser-title { margin: 22px 0 18px; }
      .chooser-title .visual-question { width: 56px; height: 56px; margin-bottom: 10px; font-size: 1.55rem; }
      .chooser-title h1 { font-size: 1.65rem; }
      .chooser-title p { font-size: 0.88rem; }
      .agent-grid { flex: 1; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(210px, 1fr); gap: 10px; }
      .agent-card { min-height: 0; border-radius: 22px; }
      .agent-card-art { inset: 3px -5px 48px; width: calc(100% + 10px); height: calc(100% - 38px); }
      .agent-card-copy { min-height: 61px; padding: 13px 6px 10px; }
      .agent-card-name { font-size: 0.9rem; }
      .agent-card-hint { display: none; }
      .agent-card-sound { top: 10px; left: 10px; width: 34px; height: 34px; font-size: 0.95rem; }

      .conversation { min-height: 100dvh; display: flex; flex-direction: column; }
      .companion-panel { min-height: 196px; height: 29dvh; padding: 12px 14px 0; border: 0; border-bottom: 1px solid var(--line); }
      .companion-top { display: none; }
      .companion-stage { min-height: 0; place-items: end center; }
      .companion-halo { width: 170px; }
      .companion-art { width: 220px; height: 25dvh; min-height: 170px; }
      .companion-copy { display: none; }
      .dialog-panel { flex: 1; min-height: 0; }
      .mobile-header { display: grid; grid-template-columns: 42px 42px minmax(0, 1fr) 32px; align-items: center; gap: 7px; padding: 10px 14px 0; background: var(--paper); }
      .mobile-agent { display: flex; align-items: center; gap: 9px; min-width: 0; }
      .mobile-agent strong { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .mobile-header .icon-button { width: 42px; height: 42px; border-radius: 14px; background: var(--theme-soft); }
      .mobile-header .visual-status { justify-self: end; justify-content: center; width: 32px; min-height: 32px; padding: 0; }
      .mobile-header .status-text { display: none; }
      .prompt-strip { padding: 10px 14px 8px; gap: 8px; }
      .prompt-button { min-width: 54px; min-height: 50px; padding: 6px 10px; border-radius: 15px; }
      .prompt-icon { font-size: 1.35rem; }
      .prompt-label { display: none; }
      .chat-container { padding: 8px 14px 14px; gap: 10px; }
      .welcome-card { padding: 16px; border-radius: 20px; font-size: 0.84rem; }
      .welcome-symbol { margin-bottom: 5px; font-size: 1.5rem; }
      .message-row { max-width: 92%; }
      .message { padding: 10px 12px; font-size: 0.92rem; }
      .message-media { width: min(70vw, 340px); margin-top: 10px; }
      .avatar { width: 31px; height: 31px; }
      .control-dock { padding: 12px 14px var(--safe-bottom); }
      .voice-controls { grid-template-columns: 46px 1fr 46px; gap: 11px; }
      .voice-controls.has-photo { grid-template-columns: 46px 46px 1fr 46px; }
      .dock-button { width: 46px; height: 46px; border-radius: 15px; }
      .mic-button { width: 76px; height: 76px; }
      .mic-symbol { transform: scale(0.82); }
      .text-composer { margin-top: 10px; }
    }

    @media (max-height: 690px) and (max-width: 720px) {
      .companion-panel { height: 22dvh; min-height: 138px; }
      .companion-art { height: 19dvh; min-height: 125px; }
      .welcome-card { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <section id="chooser" class="chooser" aria-labelledby="chooser-heading">
      <header class="chooser-header">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
          <span class="brand-copy"><strong>Клуб любопытных</strong><span>Добрые разговоры и открытия</span></span>
        </div>
        <span class="chooser-actions">
          <span class="parent-note">Домашний помощник Леры</span>
          <button class="speech-toggle browser-speech-toggle" type="button" aria-label="Выключить автоозвучку" title="Автоозвучка">🔊</button>
        </span>
      </header>

      <div class="chooser-title">
        <span class="visual-question" aria-hidden="true">✦</span>
        <h1 id="chooser-heading">С кем поговорим?</h1>
        <p>Коснись друга — он сам представится</p>
      </div>
      <div id="agent-grid" class="agent-grid" aria-live="polite"></div>
    </section>

    <section id="conversation" class="conversation" data-state="ready" hidden>
      <aside class="companion-panel">
        <div class="companion-top">
          <div class="companion-actions">
            <button class="icon-button change-agent" type="button" aria-label="Выбрать другого друга" title="Выбрать другого друга">
              <span class="switch-symbol" aria-hidden="true"><span></span><span></span><span></span><span></span></span>
            </button>
            <button class="icon-button new-conversation" type="button" aria-label="Начать новый разговор" title="Начать новый разговор">
              <span class="new-conversation-symbol" aria-hidden="true">↻</span>
            </button>
          </div>
          <div class="visual-status" role="status"><span class="status-dot"></span><span class="status-text">Готов слушать</span></div>
        </div>
        <div class="companion-stage">
          <span class="companion-halo" aria-hidden="true"></span>
          <img id="companion-art" class="companion-art" alt="" />
        </div>
        <div class="companion-copy">
          <h1 id="companion-name"></h1>
          <p id="companion-description"></p>
        </div>
      </aside>

      <section class="dialog-panel" aria-label="Разговор">
        <header class="mobile-header">
          <button class="icon-button change-agent" type="button" aria-label="Выбрать другого друга">
            <span class="switch-symbol" aria-hidden="true"><span></span><span></span><span></span><span></span></span>
          </button>
          <button class="icon-button new-conversation" type="button" aria-label="Начать новый разговор" title="Начать новый разговор">
            <span class="new-conversation-symbol" aria-hidden="true">↻</span>
          </button>
          <div class="mobile-agent"><strong id="mobile-agent-name"></strong></div>
          <div class="visual-status" role="status"><span class="status-dot"></span><span class="status-text">Готов слушать</span></div>
        </header>

        <nav id="quick-replies" class="prompt-strip" aria-label="Идеи для разговора"></nav>

        <div id="chat-container" class="chat-container" aria-live="polite">
          <div id="welcome-card" class="welcome-card">
            <span class="welcome-symbol" aria-hidden="true">✦</span>
            <p id="welcome-text"></p>
          </div>
          <div id="typing-indicator" class="typing-indicator" aria-label="Друг думает">
            <span></span><span></span><span></span>
          </div>
        </div>

        <footer class="control-dock">
          <div id="voice-controls" class="voice-controls">
            <button id="photo-btn" class="dock-button" type="button" aria-label="Выбрать фотографию" title="Фотография" hidden>📷</button>
            <button id="keyboard-toggle" class="dock-button" type="button" aria-label="Показать клавиатуру" aria-expanded="false">⌨</button>
            <button id="mic-btn" class="mic-button" type="button" aria-label="Начать голосовое сообщение">
              <span class="mic-symbol" aria-hidden="true"></span>
            </button>
            <button class="dock-button browser-speech-toggle" type="button" aria-label="Выключить автоозвучку" title="Автоозвучка">🔊</button>
          </div>
          <input id="photo-input" type="file" accept="image/jpeg,image/png,image/webp" hidden />
          <div id="text-composer" class="text-composer" hidden>
            <input id="text-input" type="text" placeholder="Напиши сообщение…" autocomplete="off" maxlength="4000" />
            <button id="send-btn" class="send-button" type="button" aria-label="Отправить">➜</button>
          </div>
        </footer>
      </section>
    </section>
  </main>

  <script src="/static/app.js?v=17"></script>
</body>
</html>
