<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family AI - Волшебный чат для Леры</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='50' font-size='48'%3E%E2%9C%A8%3C/text%3E%3C/svg%3E">
    <style>
        :root {
            --bg-1: #fff8ed;
            --bg-2: #f3e8ff;
            --bg-3: #e0f2fe;
            --card: rgba(255, 255, 255, 0.9);
            --line: rgba(148, 163, 184, 0.25);
            --text: #1f2937;
            --muted: #64748b;
            --assistant-1: #e0f2fe;
            --assistant-2: #f5f3ff;
            --child-1: #fce7f3;
            --child-2: #fdf2f8;
            --system-1: #fee2e2;
            --system-2: #fff1f2;
            --accent-1: #7c3aed;
            --accent-2: #ec4899;
            --accent-3: #06b6d4;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", "Nunito", "Trebuchet MS", sans-serif;
            color: var(--text);
            background:
                radial-gradient(1200px 500px at 8% -12%, #fde68a 0%, transparent 58%),
                radial-gradient(900px 520px at 100% -10%, #c4b5fd 0%, transparent 56%),
                linear-gradient(140deg, var(--bg-1), var(--bg-2) 52%, var(--bg-3));
            overflow: hidden;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            border-radius: 999px;
            filter: blur(3px);
            opacity: 0.45;
            z-index: 0;
            pointer-events: none;
            animation: drift 10s ease-in-out infinite;
        }

        body::before {
            width: 220px;
            height: 220px;
            left: -40px;
            bottom: 16%;
            background: radial-gradient(circle at 35% 35%, #fbcfe8, #ddd6fe);
        }

        body::after {
            width: 180px;
            height: 180px;
            right: -30px;
            top: 20%;
            background: radial-gradient(circle at 35% 35%, #bfdbfe, #a7f3d0);
            animation-delay: -4s;
        }

        @keyframes drift {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(-3deg); }
        }

        .app {
            position: relative;
            z-index: 1;
            width: min(1040px, 100vw);
            height: 100vh;
            margin: 0 auto;
            padding: 14px;
        }

        .panel {
            height: 100%;
            display: flex;
            flex-direction: column;
            border-radius: 28px;
            overflow: hidden;
            background: var(--card);
            border: 1px solid rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            box-shadow: 0 26px 60px rgba(15, 23, 42, 0.18);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 20px;
            color: #fff;
            background: linear-gradient(120deg, rgba(124, 58, 237, 0.92), rgba(236, 72, 153, 0.88));
        }

        #change-agent-btn {
            border: 1px solid rgba(255, 255, 255, 0.45);
            border-radius: 14px;
            padding: 9px 12px;
            color: #fff;
            background: rgba(255, 255, 255, 0.16);
            cursor: pointer;
            font-weight: 700;
        }

        .agent-picker {
            position: absolute;
            inset: 0;
            z-index: 20;
            display: grid;
            place-items: center;
            padding: 20px;
            background: rgba(55, 48, 90, 0.32);
            backdrop-filter: blur(12px);
        }

        .agent-picker[hidden] { display: none; }
        .agent-picker-panel {
            width: min(760px, 100%);
            max-height: 92vh;
            overflow: auto;
            padding: 22px;
            border-radius: 28px;
            text-align: center;
            background: rgba(255, 255, 255, 0.96);
            box-shadow: 0 26px 70px rgba(67, 56, 110, 0.28);
        }
        .agent-picker-panel h2 { margin: 0; font-size: clamp(1.45rem, 4vw, 2rem); }
        .agent-picker-panel > p { margin: 8px 0 18px; color: var(--muted); }
        .agent-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .agent-card {
            min-height: 170px;
            padding: 18px;
            border: 3px solid transparent;
            border-radius: 24px;
            color: var(--text);
            cursor: pointer;
            background: linear-gradient(145deg, #eff6ff, #f5f3ff);
            box-shadow: 0 10px 24px rgba(100, 116, 139, 0.15);
            transition: transform 0.16s ease, border-color 0.16s ease;
        }
        .agent-card:hover, .agent-card:focus-visible { transform: translateY(-3px); border-color: #a78bfa; outline: none; }
        .agent-card.blue { background: linear-gradient(145deg, #dbeafe, #eff6ff); }
        .agent-card.green { background: linear-gradient(145deg, #d1fae5, #ecfdf5); }
        .agent-card.purple { background: linear-gradient(145deg, #ede9fe, #faf5ff); }
        .agent-card.orange { background: linear-gradient(145deg, #ffedd5, #fff7ed); }
        .agent-card-icon { display: block; font-size: 3.5rem; margin-bottom: 7px; }
        .agent-card-name { display: block; font-size: 1.2rem; font-weight: 800; }
        .agent-card-description { display: block; margin-top: 7px; color: #475569; line-height: 1.35; }
        #close-agent-picker { margin-top: 16px; border: 0; background: transparent; color: #64748b; cursor: pointer; }

        .title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            display: grid;
            place-items: center;
            font-size: 24px;
            background: rgba(255, 255, 255, 0.22);
        }

        h1 {
            margin: 0;
            font-size: 1.2rem;
        }

        .subtitle {
            margin: 3px 0 0;
            font-size: 0.9rem;
            opacity: 0.95;
        }

        .status-wrap {
            text-align: right;
        }

        #status-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.16);
            font-size: 0.82rem;
            font-weight: 700;
            white-space: nowrap;
        }

        #status-pill::before {
            content: "";
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #22c55e;
            box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.24);
        }

        #status-pill.busy::before {
            background: #f59e0b;
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.24);
        }

        #status-pill.error::before {
            background: #ef4444;
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.24);
        }

        .quick-strip {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 10px 12px;
            border-bottom: 1px solid var(--line);
            background: rgba(255, 255, 255, 0.72);
        }

        .quick-strip button {
            border: 0;
            flex: 0 0 auto;
            padding: 8px 12px;
            border-radius: 999px;
            color: #334155;
            background: linear-gradient(120deg, #ffffff, #f8fafc);
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.09);
            cursor: pointer;
            font-weight: 600;
            font-size: 0.88rem;
            transition: transform 0.14s ease, box-shadow 0.14s ease;
        }

        .quick-strip button:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 14px rgba(15, 23, 42, 0.12);
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 14px 12px;
            scrollbar-width: thin;
            scrollbar-color: #cbd5e1 transparent;
        }

        .welcome-card {
            margin: 3px auto 6px;
            width: min(100%, 740px);
            padding: 16px;
            border-radius: 18px;
            text-align: center;
            background: linear-gradient(120deg, rgba(255, 255, 255, 0.95), rgba(240, 249, 255, 0.9));
            border: 1px solid rgba(191, 219, 254, 0.6);
            box-shadow: 0 12px 25px rgba(148, 163, 184, 0.2);
        }

        .welcome-card .emoji {
            font-size: 2rem;
            display: block;
            margin-bottom: 6px;
        }

        .welcome-card p {
            margin: 0;
            color: var(--muted);
            font-size: 0.95rem;
        }

        .message-row {
            display: flex;
            gap: 8px;
            align-items: flex-end;
            max-width: min(90%, 760px);
            animation: pop 0.2s ease-out;
        }

        .message-row.assistant {
            align-self: flex-start;
        }

        .message-row.child {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            font-size: 0.9rem;
            flex: 0 0 auto;
            background: #fff;
            border: 1px solid rgba(148, 163, 184, 0.22);
        }

        .message {
            padding: 11px 13px;
            border-radius: 16px;
            line-height: 1.45;
            font-size: 1rem;
            box-shadow: 0 8px 18px rgba(148, 163, 184, 0.18);
            word-break: break-word;
        }

        .assistant .message {
            background: linear-gradient(170deg, var(--assistant-1), var(--assistant-2));
            border-bottom-left-radius: 6px;
        }

        .child .message {
            background: linear-gradient(170deg, var(--child-1), var(--child-2));
            border-bottom-right-radius: 6px;
        }

        .system {
            align-self: center;
            padding: 10px 13px;
            border-radius: 14px;
            font-size: 0.9rem;
            color: #7f1d1d;
            text-align: center;
            background: linear-gradient(170deg, var(--system-1), var(--system-2));
            box-shadow: 0 8px 16px rgba(251, 113, 133, 0.18);
            max-width: 90%;
        }

        #typing-indicator {
            align-self: flex-start;
            display: none;
            align-items: center;
            gap: 8px;
            padding: 10px 12px;
            border-radius: 14px;
            background: #eef2ff;
            color: #4338ca;
            font-size: 0.9rem;
        }

        #typing-indicator.visible {
            display: inline-flex;
        }

        .dots {
            display: inline-flex;
            gap: 4px;
        }

        .dots span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #6366f1;
            animation: blink 1s infinite;
        }

        .dots span:nth-child(2) { animation-delay: 0.2s; }
        .dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes blink {
            0%, 80%, 100% { opacity: 0.25; transform: translateY(0); }
            40% { opacity: 1; transform: translateY(-2px); }
        }

        @keyframes pop {
            from { transform: translateY(6px) scale(0.98); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }

        #controls {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            border-top: 1px solid var(--line);
            background: rgba(255, 255, 255, 0.9);
        }

        #mic-btn,
        #send-btn {
            border: 0;
            cursor: pointer;
            transition: transform 0.14s ease, box-shadow 0.14s ease, opacity 0.2s;
        }

        #mic-btn:hover,
        #send-btn:hover { transform: translateY(-1px); }
        #mic-btn:active,
        #send-btn:active { transform: translateY(1px) scale(0.98); }

        #mic-btn {
            width: 52px;
            height: 52px;
            border-radius: 16px;
            font-size: 1.35rem;
            color: #fff;
            background: linear-gradient(140deg, #fb7185, #ef4444);
            box-shadow: 0 10px 22px rgba(239, 68, 68, 0.33);
            flex: 0 0 auto;
        }

        #mic-btn.recording {
            background: linear-gradient(140deg, #dc2626, #991b1b);
            animation: pulse 1.1s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.45); }
            50% { box-shadow: 0 0 0 12px rgba(220, 38, 38, 0); }
        }

        #text-input {
            flex: 1;
            min-width: 0;
            height: 52px;
            border-radius: 16px;
            border: 2px solid transparent;
            padding: 0 14px;
            font-size: 1rem;
            outline: none;
            background: #fff;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        #text-input:focus {
            border-color: #a78bfa;
            box-shadow: 0 0 0 4px rgba(167, 139, 250, 0.22);
        }

        #send-btn {
            height: 52px;
            padding: 0 18px;
            border-radius: 16px;
            color: #fff;
            font-weight: 700;
            font-size: 0.95rem;
            white-space: nowrap;
            background: linear-gradient(120deg, var(--accent-1), var(--accent-2));
            box-shadow: 0 10px 22px rgba(124, 58, 237, 0.3);
        }

        @media (max-width: 700px) {
            .app { padding: 0; }
            .panel { border-radius: 0; }
            header { padding: 12px; }
            .status-wrap { display: block; }
            #status-pill { display: none; }
            .message-row { max-width: 96%; }
            .quick-strip { padding: 8px; }
            #controls { padding: 10px; gap: 8px; }
            #send-btn { padding: 0 14px; }
            .agent-picker { padding: 10px; }
            .agent-picker-panel { padding: 16px; border-radius: 22px; }
            .agent-grid { grid-template-columns: 1fr 1fr; gap: 9px; }
            .agent-card { min-height: 145px; padding: 12px 8px; }
            .agent-card-icon { font-size: 2.8rem; }
            .agent-card-description { font-size: 0.82rem; }
        }
    </style>
</head>
<body>
    <main class="app">
        <section class="panel" aria-label="Чат Family AI">
            <div id="agent-picker" class="agent-picker">
                <div class="agent-picker-panel">
                    <h2>С кем поговорим?</h2>
                    <p>Выбери своего помощника</p>
                    <div id="agent-grid" class="agent-grid"></div>
                    <button id="close-agent-picker" type="button" hidden>Остаться в разговоре</button>
                </div>
            </div>
            <header>
                <div class="title">
                    <div class="logo" id="agent-logo" aria-hidden="true">✨</div>
                    <div>
                        <h1 id="agent-title">Привет, Лера!</h1>
                        <p class="subtitle" id="agent-subtitle">Выбери, с кем хочешь поговорить</p>
                    </div>
                </div>
                <div class="status-wrap">
                    <div id="status-pill">Готов к чату</div>
                    <button id="change-agent-btn" type="button">Сменить друга</button>
                </div>
            </header>

            <div id="quick-replies" class="quick-strip"></div>

            <div id="chat-container">
                <div class="welcome-card" id="welcome-card">
                    <span class="emoji">🌈</span>
                    <p id="welcome-text">Сначала выбери помощника. Потом можно писать или говорить.</p>
                </div>
                <div id="typing-indicator">
                    Думаю
                    <span class="dots" aria-hidden="true"><span></span><span></span><span></span></span>
                </div>
            </div>

            <div id="controls">
                <button id="mic-btn" title="Голосовое сообщение" aria-label="Голосовое сообщение">🎤</button>
                <input type="text" id="text-input" placeholder="Напиши что-нибудь интересное..." autocomplete="off">
                <button id="send-btn">Отправить</button>
            </div>
        </section>
    </main>

    <script src="/static/app.js?v=5"></script>
</body>
</html>
