#!/usr/sbin/nft -f

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority filter;
        policy accept;

        # Local operational health-checks must not be caught by the port drops.
        iifname "lo" accept

        ip saddr 192.168.31.173 tcp dport 9100 accept
        tcp dport 9100 drop

        ip saddr 192.168.31.173 tcp dport 8010 accept
        tcp dport 8010 drop
    }

    chain forward {
        type filter hook forward priority filter;
        policy accept;
    }

    chain output {
        type filter hook output priority filter;
        policy accept;
    }
}
